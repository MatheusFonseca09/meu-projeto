name: Terraform CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply (somente na branch main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve

      - name: Smoke test (verificação pós-deploy)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          sleep 5
          docker ps

      - name: Teste de dado no banco
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          sleep 10
          docker exec meu-container-db psql -U postgres -c "CREATE TABLE IF NOT EXISTS mensagens (id SERIAL PRIMARY KEY, texto TEXT);"
          docker exec meu-container-db psql -U postgres -c "SELECT count(*) FROM mensagens;"
          docker exec meu-container-db psql -U postgres -c "INSERT INTO mensagens (texto) VALUES ('dado do pipeline');"